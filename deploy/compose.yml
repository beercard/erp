# Vektra ERP en una VPS (Ubuntu 24.04 con Docker): aplicación, Postgres,
# Caddy (HTTPS automático) y la tarea periódica. Ver deploy/LEEME.md.
#
#   cd deploy && cp env.ejemplo .env   # completar
#   docker compose up -d --build
name: vektra

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: Postgres no queda expuesto a internet.

  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en deploy/.env}
      # Subdominios de las empresas (komsa.erp.vektra.digital): por defecto, del mismo dominio.
      DOMINIO_EMPRESAS: ${DOMINIO_EMPRESAS:-${DOMINIO}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - app

  # Tarea periódica: cada 15 minutos (avisos, correos, tiendas, cobros online…).
  tarea:
    image: curlimages/curl:latest
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?Falta CRON_SECRET en deploy/.env}
    entrypoint: ['/bin/sh', '-c']
    command:
      - 'sleep 60; while true; do curl -fsS -m 600 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/servicio; echo; sleep 900; done'
    depends_on:
      - app

volumes:
  db:
  caddy_datos:
  caddy_config:
